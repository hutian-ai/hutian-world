<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="755" viewBox="0 0 1040 755" role="img" aria-labelledby="title desc"><title id="title">一条消息的执行路径</title><desc id="desc">消息先保存到 Matrix，再经服务端核对和检索，独立宿主将任务交给 Dock 与 Windows，完成后回帖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9eafa2"/></marker><marker id="pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a35c20"/></marker></defs><rect width="1040" height="755" fill="#f4f7f1"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="45" font-size="24" font-weight="600" fill="#18392f">一条消息怎样到达 Windows，再回到原聊天</text><rect x="40" y="90" width="430" height="140" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="62" y="126" font-size="21" font-weight="600" fill="#18392f">1  页面输入</text><text x="62" y="159" font-size="17" font-weight="400" fill="#51655b">选择房间、助手与 Runtime</text><text x="62" y="185" font-size="17" font-weight="400" fill="#51655b">communications.tsx · onNew</text><rect x="570" y="90" width="430" height="140" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="592" y="126" font-size="21" font-weight="600" fill="#18392f">2  先保存消息</text><text x="592" y="159" font-size="17" font-weight="400" fill="#51655b">postConversation → Matrix</text><text x="592" y="185" font-size="17" font-weight="400" fill="#51655b">取得 eventId；发送与执行分开</text><path d="M 470 160 H 570" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 785 230 V 300" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="570" y="300" width="430" height="140" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="592" y="336" font-size="21" font-weight="600" fill="#18392f">3  核对后请求执行</text><text x="592" y="369" font-size="17" font-weight="400" fill="#51655b">askConversation：成员、Runtime</text><text x="592" y="395" font-size="17" font-weight="400" fill="#51655b">可选知识 / 记忆 → material</text><rect x="40" y="300" width="430" height="140" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="62" y="336" font-size="21" font-weight="600" fill="#18392f">4  独立宿主接收</text><text x="62" y="369" font-size="17" font-weight="400" fill="#51655b">保存原请求、提示和连接</text><text x="62" y="395" font-size="17" font-weight="400" fill="#51655b">以 eventId 关联独立 runId</text><path d="M 570 370 H 470" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 255 440 V 510" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="510" width="430" height="140" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="62" y="546" font-size="21" font-weight="600" fill="#18392f">5  Dock → Windows Codex</text><text x="62" y="579" font-size="17" font-weight="400" fill="#51655b">prepare / execute → 原生 Harness</text><text x="62" y="605" font-size="17" font-weight="400" fill="#51655b">保留原运行与结果，不盲目重派</text><rect x="570" y="510" width="430" height="140" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="592" y="546" font-size="21" font-weight="600" fill="#18392f">6  回复回到 Matrix</text><text x="592" y="579" font-size="17" font-weight="400" fill="#51655b">发送带原消息引用的回复</text><text x="592" y="605" font-size="17" font-weight="400" fill="#51655b">网页读取消息，显示“已回复”</text><path d="M 470 580 H 570" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><text x="40" y="704" font-size="19" font-weight="600" fill="#166747">发送成功 ≠ 执行完成 ≠ 回复已交付。未知结果沿原 runId 核对。</text></g></svg>