<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc"><title id="title">知识与记忆怎样变成上下文</title><desc id="desc">知识先保留原文再索引，记忆保存来源后异步整理。可检索的片段按当前请求进入执行，带版本与来源。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9eafa2"/></marker><marker id="pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a35c20"/></marker></defs><rect width="1040" height="650" fill="#f4f7f1"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="45" font-size="24" font-weight="600" fill="#18392f">保存 → 处理 → 检索 → 本次上下文</text><text x="40" y="100" font-size="19" font-weight="600" fill="#166747">知识资料</text><rect x="40" y="125" width="260" height="135" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="62" y="161" font-size="21" font-weight="600" fill="#18392f">保存 Markdown 原文</text><text x="62" y="194" font-size="17" font-weight="400" fill="#51655b">稳定文档 ID</text><text x="62" y="220" font-size="17" font-weight="400" fill="#51655b">原文与导入状态</text><rect x="390" y="125" width="260" height="135" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="412" y="161" font-size="21" font-weight="600" fill="#18392f">AnythingLLM 索引</text><text x="412" y="194" font-size="17" font-weight="400" fill="#51655b">确认成功：ready</text><text x="412" y="220" font-size="17" font-weight="400" fill="#51655b">未知：保留原文待核对</text><rect x="740" y="125" width="260" height="135" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="762" y="161" font-size="21" font-weight="600" fill="#18392f">按问题检索</text><text x="762" y="194" font-size="17" font-weight="400" fill="#51655b">返回相关片段</text><text x="762" y="220" font-size="17" font-weight="400" fill="#51655b">保留版本和原文链接</text><path d="M 300 192 H 390" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 650 192 H 740" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><text x="40" y="315" font-size="19" font-weight="600" fill="#166747">长期记忆</text><rect x="40" y="340" width="260" height="135" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="62" y="376" font-size="21" font-weight="600" fill="#18392f">明确保存偏好 / 决定</text><text x="62" y="409" font-size="17" font-weight="400" fill="#51655b">来源文档与操作 ID</text><text x="62" y="435" font-size="17" font-weight="400" fill="#51655b">不自动保存所有对话</text><rect x="390" y="340" width="260" height="135" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="412" y="376" font-size="21" font-weight="600" fill="#18392f">Hindsight 异步整理</text><text x="412" y="409" font-size="17" font-weight="400" fill="#51655b">查询原操作状态</text><text x="412" y="435" font-size="17" font-weight="400" fill="#51655b">完成后才可召回</text><rect x="740" y="340" width="260" height="135" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="762" y="376" font-size="21" font-weight="600" fill="#18392f">按范围召回</text><text x="762" y="409" font-size="17" font-weight="400" fill="#51655b">追溯原始来源</text><text x="762" y="435" font-size="17" font-weight="400" fill="#51655b">当前为工作台范围</text><path d="M 300 407 H 390" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 650 407 H 740" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 1005 192 H 1020 V 550 H 895" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 870 475 V 510" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="390" y="510" width="505" height="105" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="412" y="546" font-size="21" font-weight="600" fill="#18392f">prepareReferences → material</text><text x="412" y="579" font-size="17" font-weight="400" fill="#51655b">片段 + 来源 + 版本；本次发送给所选 Runtime</text><text x="40" y="622" font-size="18" font-weight="400" fill="#51655b">完整原文、检索片段和角色正式指令是三种不同输入。</text></g></svg>