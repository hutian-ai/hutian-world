<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img" aria-labelledby="title desc"><title id="title">当前 hutian 的接入关系</title><desc id="desc">Next 服务端分别接入 Nest 业务 API、Matrix 通信与知识记忆模块。通信宿主通过 Dock 调用 Windows 或 macOS。角色绑定虚线未完成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9eafa2"/></marker><marker id="pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a35c20"/></marker></defs><rect width="1040" height="710" fill="#f4f7f1"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="45" font-size="24" font-weight="600" fill="#18392f">当前实现 · 服务端接入与数据归属</text><rect x="390" y="80" width="260" height="115" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="412" y="116" font-size="21" font-weight="600" fill="#18392f">hutian Web / Next</text><text x="412" y="149" font-size="17" font-weight="400" fill="#51655b">页面、Server Actions</text><text x="412" y="175" font-size="17" font-weight="400" fill="#51655b">服务端保存连接凭据</text><path d="M 440 195 V 225 H 170 V 270" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 520 195 V 270" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 600 195 V 225 H 870 V 270" fill="none" stroke="#9eafa2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="270" width="260" height="145" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="62" y="306" font-size="21" font-weight="600" fill="#18392f">Nest 业务 API</text><text x="62" y="339" font-size="17" font-weight="400" fill="#51655b">成员人设、项目与关联</text><text x="62" y="365" font-size="17" font-weight="400" fill="#51655b">正式业务数据读写</text><rect x="390" y="270" width="260" height="145" rx="14" fill="#ffffff" stroke="#d4dfd3"/><text x="412" y="306" font-size="21" font-weigh